<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A1</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<!-- body colour  -->

<body class="bg-dark text-light">

    <!-- navbar -->
    <div class="container-fluid bg-primary">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand text-white" href="#">Assignment</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active text-white" aria-current="page" href="#">Home</a>
                        </li>
                       


                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </div>
    <!-- heading -->
    <div class="container text-center fs-2 my-4 text-light ">
        Introduction to javascript
        <hr />
    </div>

    <!-- buttons  -->

    <div class="container border border-light rounded d-block py-4 text-center mb-5">
        <!-- concatenate  -->
        <button type="button" id="concatenate" class="btn btn-primary btn-lg mx-1 my-2">concatenate some strings</button>
        <!-- ask name from user  -->
        <button type="button" id="askName" class="btn btn-primary btn-lg mx-1 my-2">ask name from user</button>
        <!-- if else -->
        <button type="button" id="comparsion" class="btn btn-primary btn-lg mx-1 my-2">if else</button>
        <!-- if else if  -->
        <button type="button" id="ifElseIf" class="btn btn-primary btn-lg mx-1 my-2">if else if</button>
        <!-- login  -->
        <button type="button" id="login" class="btn btn-primary btn-lg mx-1 my-2">login</button>
        <!-- register  -->
        <button type="button" id="reg" class="btn btn-primary btn-lg mx-1 my-2">register</button>
    </div>
    <div class="container text-center fs-2 text-light mb-2"> Original Statement</div>
    <div id="realState" class="container text-center border border-light rounded p-4"></div>

    <!-- clearState -->

    <div class="container text-center mt-2">
        <button type="button" onclick="clearState()" class="btn btn-outline-primary btn-lg my-2">Clear
            Statement</button>
    </div>
    <div class="container text-center fs-2 text-light mt-3 mb-2"> Output</div>
    <div id="out" class="container text-center border border-light rounded p-4"></div>

    <!-- clearOut -->

    <div class="container text-center mt-2">
        <button type="button" onclick="clearOut()" class="btn btn-outline-primary btn-lg my-2">Clear Statement</button>
    </div>

    <!-- footer  -->

    <div class="container-fluid bg-primary text-center text-light mt-3 fs-5 p-2">
        &copy; 2026 | All Rights Reserved.
    </div>


</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="script.js"></script>

</html>
